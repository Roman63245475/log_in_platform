services:
  client:
    build:
      context: .
      dockerfile: client.Dockerfile
    ports:
      - "8088:8088"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "5056:5056"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5056
      - ASPNETCORE_URLS=http://+:5056
      - ConnectionStrings__connection_string=Server=db;Port=5432;Database=login_platform;User Id=postgres;Password=postgres_password
      - JWT__Issuer=sec-api-jwt
      - JWT__Audience=sec-api-jwt
      - JWT__Secret=Roman-is-a-cigan-that-is-the-development-key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5056/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=login_platform
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
